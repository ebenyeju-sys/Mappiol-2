<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mappiol Pro | Immobilier</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="header-inner">
            <div class="m-logo">MAPPIOL <span style="color:var(--txt)">PRO</span></div>
            <button id="theme-btn"><i class="fa-solid fa-circle-half-stroke"></i></button>
        </div>
    </header>

    <div id="router-outlet">
        <p style="text-align:center; padding:100px; color:var(--txt-muted);">Initialisation...</p>
    </div>

    <div class="modal" id="add-modal">
        <div class="modal-content">
            <h2>Publier un bien</h2>
            <label>Titre</label>
            <input type="text" id="new-title" placeholder="Ex: Studio moderne">
            <label>Quartier</label>
            <input type="text" id="new-loc" placeholder="Ex: Bastos, Yaoundé">
            <label>Prix (Min 10 000 FCFA)</label>
            <input type="number" id="new-price" placeholder="Prix en FCFA">
            <label>Type</label>
            <select id="new-type">
                <option value="Chambre">Chambre</option>
                <option value="Studio">Studio</option>
                <option value="Appartement">Appartement</option>
            </select>
            <button class="btn" id="save-btn">Mettre en ligne</button>
            <button class="btn-secondary" id="close-add">Annuler</button>
        </div>
    </div>

    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <div id="auth-logged-out">
                <h2>Connexion</h2>
                <input type="email" id="auth-email" placeholder="Email">
                <input type="password" id="auth-pass" placeholder="Mot de passe">
                <button class="btn" id="btn-login">Se connecter / S'inscrire</button>
            </div>
            <div id="auth-logged-in" style="display:none; text-align:center;">
                <h2>Mon Profil</h2>
                <p id="user-display-email" style="margin-bottom:20px; font-weight:600;"></p>
                <button class="btn" style="background:#ef4444;" id="btn-logout">Se déconnecter</button>
            </div>
            <button class="btn-secondary" id="close-auth">Fermer</button>
        </div>
    </div>

    <nav class="mobile-nav">
        <i class="fa-solid fa-house-chimney" id="nav-home"></i>
        <div class="nav-center" id="nav-add"><i class="fa-solid fa-plus"></i></div>
        <i class="fa-solid fa-user-circle" id="nav-profile"></i>
    </nav>

    <script type="module" src="script.js"></script>
</body>
</html>
